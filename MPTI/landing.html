<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RUMAH MAKAN HAJI MARAH</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #333;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== LANDING HERO ===== */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            text-align: center;
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background: radial-gradient(circle at 50% 50%, rgba(214, 228, 19, 0.05) 0%, transparent 70%);
            z-index: 0;
        }

        .logo-container {
            position: relative;
            z-index: 1;
            margin-bottom: 24px;
        }

        .logo {
            width: 140px;
            height: 140px;
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            animation: float 3s ease-in-out infinite;
        }

        .logo img{
            width: 170px;
            height: 130px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;
            color: #222;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .slogan {
            font-size: 16px;
            color: #666;
            font-weight: 500;
            margin-bottom: 40px;
            max-width: 280px;
            line-height: 1.5;
        }

        /* ===== GLASSMORPHISM BUTTONS ===== */
        .nav-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .glass-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 24px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.7);
            z-index: -1;
            transition: background 0.3s;
        }

        .glass-btn:hover::before {
            background: #a38a6a;
        }

        .glass-btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            color: #333;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        .btn-secondary {
            color: #333;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        .btn-icon {
            font-size: 24px;
        }

        /* ===== FOOTER ===== */
        .footer {
            padding: 24px;
            text-align: center;
            font-size: 12px;
            color: #999;
            font-weight: 500;
        }

        /* Desktop optimization */
        @media (min-width: 768px) {
            .hero {
                padding: 60px 40px;
            }
            .brand-name {
                font-size: 48px;
            }
            .slogan {
                font-size: 18px;
                max-width: 400px;
            }
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="logo-container">
            <div class="logo"><img src="logo2.png" alt=""></div>
        </div>
        <div class="brand-name">RUMAH MAKAN PAK HAJI MARAH</div>
        <div class="slogan">Pesan Tanpa Antri, Pesan Meja di Mana Saja</div>

        <div class="nav-container">
            <a href="reservasi.html" class="glass-btn btn-primary">
                <span class="btn-icon"></span>
                <span>Reservasi Meja</span>
            </a>
            <a href="index.html" class="glass-btn btn-secondary">
                <span class="btn-icon"></span>
                <span>Pesan Online</span>
            </a>
        </div>
    </div>

    <div class="footer">
        © 2024 Mie Gacoan. All rights reserved.
    </div>

</body>
</html>
